# CI: lint, build, isolated tests, secret scanning and dependency audit (m1-009).
# Spec: docs/milestones/m1-009-ci-and-security-scanning-spec.md
#
# - No repository secrets are used. The session secret and test-admin
#   password are generated per run and masked.
# - Tests run on a fresh SQLite database under RUNNER_TEMP (npm run test:ci).
# - Third-party actions are pinned to full commit SHAs (version in comment).
#   Updating a pin is a dependency change and needs approval (AGENTS.md).
# - release (m1-068, D-DB-21): on a push to main, after every job above
#   passes, builds the stack's images for amd64 and arm64 on native runners,
#   starts and checks the stack, then pushes them to ghcr.io (private
#   packages). Only that job can write packages, with the run's own
#   GITHUB_TOKEN; no other secret. The <sha> tag is written only when both
#   architectures pass. Design: docs/milestones/m1-068-release-pipeline-design.md
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Production build
        run: |
          # The app refuses to load without a session secret; generate a
          # throwaway one and mask it before use.
          APOS_SESSION_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$APOS_SESSION_SECRET"
          export APOS_SESSION_SECRET
          export APOS_DB_URI="sqlite://$RUNNER_TEMP/build-$GITHUB_RUN_ID.sqlite"
          export APOS_RELEASE_ID="$GITHUB_SHA"
          npm run build

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Unit tests (audit gate, test-admin guard)
        run: npm run test:unit
      - name: Smoke, editor workflow and persistence on a throwaway database
        # Generates and masks its own secrets; database and uploads live in
        # RUNNER_TEMP and are deleted at the end. Prints the server log tail
        # on failure. See scripts/run-ci-tests.mjs.
        run: npm run test:ci

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's
      # gitleaks_8.30.1_checksums.txt (verified 2026-10-20).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      # The same file's id in the GitHub API, for the fallback download
      # (m1-053). Change it together with the version.
      GITLEAKS_ASSET_ID: '378332058'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # The release download URL has returned 504 for hours at a time
          # (m1-052, m1-053). Retry it, then fall back to the API's download
          # of the same file. The checksum below verifies whichever succeeds.
          curl -sSfL --retry 3 --retry-all-errors -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" ||
            curl -sSfL --retry 3 --retry-all-errors -H "Accept: application/octet-stream" -o gitleaks.tar.gz \
              "https://api.github.com/repos/gitleaks/gitleaks/releases/assets/${GITLEAKS_ASSET_ID}"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir gitleaks-bin
          tar -xzf gitleaks.tar.gz -C gitleaks-bin gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan full git history (findings redacted)
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # npm audit reads package-lock.json; no install is needed.
      - name: npm audit against security/audit-baseline.json
        run: npm run audit:check

  # Builds, checks and pushes one architecture. MongoDB 8.0 refuses Linux
  # kernels 6.19 to 7.0.13 (D-DB-16), so both runners are ubuntu-22.04.
  release:
    name: release (${{ matrix.arch }})
    needs: [lint, build, test, secrets, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      ASSURER_REGISTRY: ghcr.io/mimnets
      ASSURER_IMAGE_TAG: ${{ github.sha }}-${{ matrix.arch }}
      APOS_RELEASE_ID: ${{ github.sha }}
      ASSURER_DOMAIN: localhost
      APOS_BASE_URL: https://localhost
      S: docker compose -f docker/staging/compose.yaml -f docker/staging/compose.build.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the images
        run: $S build

      - name: The images are linux/${{ matrix.arch }}
        run: |
          for name in app mongo nginx certbot; do
            arch="$(docker image inspect -f '{{.Architecture}}' "$ASSURER_REGISTRY/assurer-$name:$ASSURER_IMAGE_TAG")"
            echo "assurer-$name $arch"
            test "$arch" = "${{ matrix.arch }}"
          done

      - name: Start the stack
        run: $S up -d

      - name: The app becomes healthy
        run: |
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$($S ps -q app)")"
            echo "$status"
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && exit 1
            sleep 5
          done
          exit 1

      - name: HTTP redirects to HTTPS, HTTPS answers through nginx
        run: |
          curl -sI http://localhost/ | tee headers.txt
          grep -q '^HTTP/1.1 301' headers.txt
          curl -skI https://localhost/ | tee headers.txt
          grep -qE '^HTTP/[0-9.]+ 200' headers.txt

      - name: pbm-agent is running
        run: |
          for _ in $(seq 1 24); do
            $S exec -T pbm pbmc status > pbm.txt 2>&1 && grep -q 'pbm-agent \[v2.17.0\] OK' pbm.txt && exit 0
            sleep 5
          done
          cat pbm.txt
          exit 1

      - name: Log lines after a failure
        if: failure()
        run: |
          $S ps -a
          $S logs --tail 80 | grep -F '[assurer' || true

      - name: Remove the stack
        if: always()
        run: $S down -v

      - name: Push the images (by architecture)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          # Up to 3 tries per image: ghcr.io sometimes answers a push with a
          # passing error (m1-068).
          for name in app mongo nginx certbot; do
            image="$ASSURER_REGISTRY/assurer-$name:$ASSURER_IMAGE_TAG"
            for try in 1 2 3; do
              docker push --quiet "$image" && break
              [ "$try" = 3 ] && exit 1
              echo "push of $image failed (try $try); again in $((try * 15)) s"
              sleep $((try * 15))
            done
          done
          docker logout ghcr.io

  # Joins the two architectures under the commit's tag, the one deploy.sh pulls.
  release-tag:
    name: release-tag
    needs: [release]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      ASSURER_REGISTRY: ghcr.io/mimnets
      SHA: ${{ github.sha }}
    steps:
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          for name in app mongo nginx certbot; do
            image="$ASSURER_REGISTRY/assurer-$name"
            docker buildx imagetools create -t "$image:$SHA" "$image:$SHA-amd64" "$image:$SHA-arm64"
            docker buildx imagetools inspect "$image:$SHA" | grep -E 'Name:|Platform:'
          done
          docker logout ghcr.io
          echo "::notice title=Release::ghcr.io images tagged $SHA; on the server: bash docker/staging/deploy.sh $SHA"
