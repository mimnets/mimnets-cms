# Staging stack on linux/arm64 (m1-058; one container per service since
# m1-068, D-DB-20): builds and starts docker/staging on
# GitHub's native arm64 runner, because the owner's PC has too little memory to
# build it under emulation. Proves the images build and work on arm64, not a
# server: the certificate is self-signed and the stack is thrown away.
#
# - No repository secrets are used, and nothing is pushed. The stack makes its
#   own secrets per run. Only the "[assurer]" log lines are printed.
# - Each check is its own step, so its result can be read from the public API.
# - The actions are pinned as in ci.yml. Updating a pin needs approval (AGENTS.md).
# - m1-060 adds an accepted upload, a PITR restore drill and the images as a
#   one-day artifact for a Docker Scout scan on the owner's PC. The upload logs
#   in as the stack's own admin, whose password this run makes; it is masked
#   and never leaves the runner. The owner approved the drill for this
#   throwaway stack on every run (PBM runbook §3).
# Guide: docs/runbooks/staging-container.md
name: Staging arm64

on:
  pull_request:
    paths:
      - .github/workflows/staging-arm64.yml
      - docker/staging/**
      - Dockerfile
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-arm64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  staging-arm64:
    name: staging-arm64
    # MongoDB 8.0 refuses Linux kernels 6.19 to 7.0.13, which ubuntu-24.04-arm
    # hit in m1-058 (production notes in the MongoDB manual).
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    env:
      ASSURER_DOMAIN: localhost
      APOS_BASE_URL: https://localhost
      ASSURER_IMAGE_TAG: ci
      S: docker compose -f docker/staging/compose.yaml -f docker/staging/compose.build.yaml
      R: docker compose -f docker/staging/compose.yaml -f docker/staging/compose.build.yaml --profile restore
      RS: docker compose -f docker/staging/compose.yaml -f docker/staging/compose.build.yaml --profile restore --profile restore-site
      MARKER_SLUG: /m1-060-restore-marker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The annotation can be read from the public API without a login.
      - name: Kernel and Compose versions
        run: |
          uname -r
          echo "::notice title=Runner kernel::$(uname -r)"
          echo "Runner kernel: $(uname -r)" >> "$GITHUB_STEP_SUMMARY"
          docker compose version

      - name: Build as the runbook writes it
        run: $S build

      - name: All images are linux/arm64
        run: |
          for image in ghcr.io/mimnets/assurer-{app,mongo,nginx,certbot}:ci; do
            arch="$(docker image inspect -f '{{.Architecture}}' "$image")"
            echo "$image $arch"
            test "$arch" = arm64
          done

      # For a Docker Scout scan on the owner's PC (archive://), which needs a
      # Docker ID this workflow does not have. The images hold no secrets:
      # the stack makes them at its first start.
      - name: Save the images for the scan
        run: |
          mkdir images
          for name in app mongo nginx certbot; do
            docker save -o "images/assurer-$name.tar" "ghcr.io/mimnets/assurer-$name:ci"
          done
          ls -l images

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-arm64-images
          path: images/
          retention-days: 1
          if-no-files-found: error

      - name: Start as the runbook writes it
        run: $S up -d

      - name: App becomes healthy
        run: |
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$($S ps -q app)")"
            echo "$status"
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && exit 1
            sleep 5
          done
          exit 1

      - name: apt upgrade is in the image and the removed files are gone
        run: |
          $S exec -T mongo dpkg-query -W -f='${Package} ${Version}\n' apt libapt-pkg6.0t64 | tee packages.txt
          test "$(grep -c ' 2\.8\.4ubuntu0\.1$' packages.txt)" = 2
          $S exec -T mongo sh -c 'for f in /usr/local/bin/gosu /opt/js-yaml /usr/local/bin/docker-entrypoint.sh; do [ ! -e "$f" ] || exit 1; done'
          $S exec -T app sh -c 'for f in /app/node_modules/@esbuild /usr/local/lib/node_modules /usr/local/bin/npm; do [ ! -e "$f" ] || exit 1; done'

      - name: HTTP redirects to HTTPS
        run: |
          curl -sI http://localhost/ | tee headers.txt
          grep -q '^HTTP/1.1 301' headers.txt
          grep -qi '^location: https://localhost/' headers.txt

      - name: HTTPS answers through nginx with HSTS
        run: |
          curl -skI https://localhost/ | tee headers.txt
          grep -qE '^HTTP/[0-9.]+ 200' headers.txt
          grep -qi '^strict-transport-security:' headers.txt

      - name: nginx refuses an upload over the limit
        run: |
          head -c 35651584 /dev/zero > big.bin
          code="$(curl -sk -o /dev/null -w '%{http_code}' --data-binary @big.bin https://localhost/api/v1/@apostrophecms/attachment/upload)"
          echo "$code"
          test "$code" = 413

      - name: nginx rate limit answers 429
        run: |
          curl -skZ --parallel-immediate --parallel-max 100 -o /dev/null -w '%{http_code}\n' 'https://localhost/?r=[1-300]' | sort | uniq -c | tee codes.txt
          grep -q ' 429$' codes.txt

      - name: First base backup finishes and PBM is running
        run: |
          for _ in $(seq 1 60); do
            $S logs backup | grep -q '\[assurer\] Base backup finished' && break
            sleep 5
          done
          $S logs backup | grep -q '\[assurer\] Base backup finished'
          $S exec -T pbm pbmc status | tee pbm.txt
          grep -q 'pbm-agent \[v2.17.0\] OK' pbm.txt

      # MongoDB too: the app and PBM connect to it again.
      - name: Stack survives a restart
        run: |
          $S restart mongo
          $S restart app pbm backup
          for _ in $(seq 1 60); do
            [ "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/)" = 200 ] && exit 0
            sleep 5
          done
          exit 1

      # The token is kept on the runner for the marker step, masked like the password.
      - name: Accepted upload through nginx is served back complete
        run: |
          set -o pipefail
          password="$($S exec -T app cat /app/data/admin-initial-password)"
          echo "::add-mask::$password"
          token="$(jq -n --arg p "$password" '{username: "admin", password: $p}' |
            curl -skf -H 'content-type: application/json' --data-binary @- \
              https://localhost/api/v1/@apostrophecms/login/login | jq -r .token)"
          echo "::add-mask::$token"
          test -n "$token" && test "$token" != null
          printf '%s' "$token" > "$RUNNER_TEMP/apos-token"
          head -c 5242880 /dev/urandom > m1060-upload.pdf
          curl -skf -H "authorization: Bearer $token" \
            -F 'file=@m1060-upload.pdf;type=application/pdf' \
            https://localhost/api/v1/@apostrophecms/attachment/upload > attachment.json
          jq -r '"/uploads/attachments/\(._id)-\(.name).\(.extension)"' attachment.json | tee upload-path.txt
          curl -skf "https://localhost$(cat upload-path.txt)" -o served.pdf
          sha256sum m1060-upload.pdf served.pdf | tee sums.txt
          test "$(cut -d' ' -f1 sums.txt | uniq | wc -l)" = 1

      # The restart starts a second base backup 2 minutes later. The page is
      # published after it, so the drill must replay the oplog to bring it back.
      - name: Marker page published after the newest base backup
        run: |
          set -o pipefail
          count=0
          for _ in $(seq 1 60); do
            count="$($S logs backup | grep -cF '[assurer] Base backup finished' || true)"
            [ "$count" -ge 2 ] && break
            sleep 5
          done
          test "$count" -ge 2
          token="$(cat "$RUNNER_TEMP/apos-token")"
          marker="m1-060 restore marker $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          page="$(jq -n --arg t "$marker" --arg s "$MARKER_SLUG" \
            '{title: $t, type: "default-page", slug: $s, _targetId: "_home", _position: "lastChild"}' |
            curl -skf -H "authorization: Bearer $token" -H 'content-type: application/json' --data-binary @- \
              'https://localhost/api/v1/@apostrophecms/page?aposMode=draft' | jq -r ._id)"
          curl -skf -X POST -H "authorization: Bearer $token" -H 'content-type: application/json' -d '{}' \
            "https://localhost/api/v1/@apostrophecms/page/$page/publish?aposMode=draft" > /dev/null
          date -u +%s | tee marker-time.txt
          curl -skf "https://localhost$MARKER_SLUG" -o marker.html
          grep -qF "$marker" marker.html

      # PITR slices are written every 5 minutes (PBM runbook §1).
      - name: PITR covers the marker page
        run: |
          marker_time="$(cat marker-time.txt)"
          end=
          for _ in $(seq 1 60); do
            $S exec -T pbm pbmc list --out=json > pbm-list.json || true
            end="$(jq --argjson t "$marker_time" \
              '[.. | objects | select(has("start") and has("end")) | select(.start <= $t and .end >= $t) | .end] | max // empty' \
              pbm-list.json || true)"
            [ -n "$end" ] && break
            sleep 10
          done
          test -n "$end"
          date -u -d "@$end" +%Y-%m-%dT%H:%M:%S | tee restore-time.txt

      # PBM runbook §3 step 2, into the restore services' own, empty volumes.
      - name: PITR restore into new, empty containers
        run: |
          date +%s > restore-start.txt
          $R run --rm restore-copy
          $R up -d --no-deps restore-mongo
          status=
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$($R ps -q restore-mongo)")"
            [ "$status" = healthy ] && break
            sleep 5
          done
          test "$status" = healthy
          $R up -d --no-deps restore-pbm
          $R up --no-deps restore-pbm-config
          $R exec -T restore-pbm pbmc config --force-resync --wait
          $R exec -T restore-pbm pbmc restore --time="$(cat restore-time.txt)" --yes --wait

      # PBM runbook §3 step 3.
      - name: Restored site serves the marker page and the upload
        run: |
          $RS up -d --no-deps restore-app
          for _ in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3044/)" = 200 ] && break
            sleep 5
          done
          curl -sf "http://127.0.0.1:3044$MARKER_SLUG" -o restored.html
          grep -qF "m1-060 restore marker $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" restored.html
          curl -sf "http://127.0.0.1:3044$(cat upload-path.txt)" -o restored.pdf
          sha256sum m1060-upload.pdf restored.pdf | tee sums.txt
          test "$(cut -d' ' -f1 sums.txt | uniq | wc -l)" = 1
          seconds=$(( $(date +%s) - $(cat restore-start.txt) ))
          echo "::notice title=Restore drill::$seconds s from the copy step to a working site"

      - name: Startup log lines
        if: always()
        run: $S logs | grep -F '[assurer' || true

      # MongoDB's own log lines hold no passwords, only user and host names.
      - name: Diagnostics after a failure
        if: failure()
        run: |
          uname -m
          getconf PAGESIZE
          grep -m1 -i '^features' /proc/cpuinfo || true
          $S ps -a
          docker run --rm --entrypoint mongod ghcr.io/mimnets/assurer-mongo:ci --version || echo "mongod --version exit $?"
          $S logs --tail 60 mongo app | grep -vF '[assurer]' | cut -c1-600 || true
          $RS ps -a || true
          $RS logs --tail 60 restore-mongo restore-app | cut -c1-600 || true
          $R exec -T restore-pbm pbmc logs --tail 30 || true

      - name: Remove the stack
        if: always()
        run: $RS down -v
