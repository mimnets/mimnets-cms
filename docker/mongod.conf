# MongoDB inside the single container (m1-043). Never published to the host.
storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1 # The app shares this container's memory.
net:
  port: 27017
  bindIp: 127.0.0.1
security:
  authorization: enabled
  keyFile: /data/secrets/mongo-keyfile
  javascriptEnabled: false # Hardening runbook §12 choice 7.
replication:
  replSetName: rs0 # Point-in-time recovery will need a replica set (D-DB-4).
