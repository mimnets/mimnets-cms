# MongoDB in the stack's mongo container (m1-055; own container since m1-068,
# D-DB-20). No published port: only the internal db network reaches it. The
# setup job creates the TLS files and the key file; the entrypoint sets the
# cache size with --wiredTigerCacheSizeGB.
# Guide: docs/runbooks/staging-container.md
storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1 # Replaced by ASSURER_MONGO_CACHE_GB at start.
net:
  port: 27017
  # All of the container's addresses: the db network and localhost, which the
  # first user needs (localhost exception).
  bindIp: 0.0.0.0
  tls:
    mode: requireTLS # Hardening runbook §6.
    certificateKeyFile: /secrets/tls/mongod.pem
    CAFile: /secrets/tls/ca.pem
    # Clients log in with a password (SCRAM), not a client certificate.
    allowConnectionsWithoutCertificates: true
security:
  authorization: enabled
  # Member authentication: a key file is acceptable on staging; production
  # needs x.509 (hardening runbook §12 choice 2).
  keyFile: /secrets/mongo-keyfile
  clusterAuthMode: keyFile
  javascriptEnabled: false # Hardening runbook §12 choice 7.
replication:
  replSetName: rs0 # One member, mongo:27017; needed for point-in-time recovery (D-DB-4).
