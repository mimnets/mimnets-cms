# MongoDB inside the staging container (m1-055). Never published outside the
# container. The entrypoint creates the TLS files and the key file on first
# start, and sets the cache size with --wiredTigerCacheSizeGB.
# Guide: docs/runbooks/staging-container.md
storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1 # Replaced by ASSURER_MONGO_CACHE_GB at start.
net:
  port: 27017
  bindIp: 127.0.0.1
  tls:
    mode: requireTLS # Hardening runbook §6.
    certificateKeyFile: /data/secrets/tls/mongod.pem
    CAFile: /data/secrets/tls/ca.pem
    # Clients log in with a password (SCRAM), not a client certificate.
    allowConnectionsWithoutCertificates: true
security:
  authorization: enabled
  # Member authentication: a key file is acceptable on staging; production
  # needs x.509 (hardening runbook §12 choice 2).
  keyFile: /data/secrets/mongo-keyfile
  clusterAuthMode: keyFile
  javascriptEnabled: false # Hardening runbook §12 choice 7.
replication:
  replSetName: rs0 # One member; needed for point-in-time recovery (D-DB-4).
