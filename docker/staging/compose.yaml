# The stack (m1-055; one container per service since m1-068, D-DB-20): the
# app, MongoDB with TLS, pbm-agent and the backup schedule, each in its own
# container, behind nginx with certbot. Only nginx publishes ports. The images
# come from ghcr.io, built by CI for each commit on main (D-DB-21); on a server,
# docker/staging/deploy.sh pulls and starts them. To build locally instead, add
# compose.build.yaml (see there). Run from the repository root:
#   docker compose -f docker/staging/compose.yaml up -d
# Settings: docker/staging/.env (written by the setup scripts) and
# docker/staging/site.env (SMTP and so on); both git-ignored.
# Guide: docs/runbooks/staging-container.md
name: mimnets-cms

x-app-image: &app-image ${ASSURER_REGISTRY:-ghcr.io/mimnets}/assurer-app:${ASSURER_IMAGE_TAG:?set the release, a commit SHA on main (deploy.sh sets it)}
x-mongo-image: &mongo-image ${ASSURER_REGISTRY:-ghcr.io/mimnets}/assurer-mongo:${ASSURER_IMAGE_TAG:?set the release, a commit SHA on main (deploy.sh sets it)}

services:
  # Writes the missing secrets and the MongoDB TLS files at each start, then
  # exits (setup.sh). Each service below mounts only its own secrets volume.
  setup:
    image: *mongo-image
    entrypoint: ["assurer-setup"]
    volumes:
      - mongo-secrets:/secrets/mongo
      - app-secrets:/secrets/app
      - pbm-secrets:/secrets/pbm
    network_mode: none

  mongo:
    image: *mongo-image
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      # Size it with the app's processes against the server's memory (m1-054 results §3).
      ASSURER_MONGO_CACHE_GB: ${ASSURER_MONGO_CACHE_GB:-1}
    volumes:
      - mongo-db:/data/db
      - mongo-secrets:/secrets:ro
    networks:
      - db
    healthcheck:
      test: ["CMD", "assurer-mongo-health"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 6
    mem_limit: ${ASSURER_MONGO_MEMORY:-2g}

  # pbm-agent is the container's only process; Docker restarts it if it stops.
  pbm:
    image: *mongo-image
    user: pbm
    entrypoint: ["assurer-pbm-agent"]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - pbm-backups:/backups
      - pbm-secrets:/secrets:ro
    networks:
      - db
    mem_limit: ${ASSURER_PBM_MEMORY:-1g}

  # The PBM configuration and the base-backup schedule (backup-schedule.sh).
  backup:
    image: *mongo-image
    user: pbm
    entrypoint: ["assurer-backup-schedule"]
    restart: unless-stopped
    depends_on:
      pbm:
        condition: service_started
    environment:
      ASSURER_BACKUP_INTERVAL_HOURS: ${ASSURER_BACKUP_INTERVAL_HOURS:-24}
      ASSURER_BACKUP_RETENTION: ${ASSURER_BACKUP_RETENTION:-8d}
    volumes:
      - pbm-backups:/backups:ro
      - pbm-secrets:/secrets:ro
    networks:
      - db
    mem_limit: ${ASSURER_BACKUP_MEMORY:-256m}

  app:
    image: *app-image
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - path: ./site.env
        required: false
    environment:
      APOS_BASE_URL: ${APOS_BASE_URL:?set the public https origin, for example https://www.example.org}
      APOS_HTTPS: "1"
      # Only nginx may set the X-Forwarded headers (security-configuration.md).
      APOS_TRUST_PROXY: ${ASSURER_NGINX_IP:-172.30.57.10}
      # Start short and raise it once HTTPS is confirmed (runbook §8 point 4).
      APOS_HSTS_MAX_AGE: ${APOS_HSTS_MAX_AGE:-300}
      APOS_CLUSTER_PROCESSES: ${APOS_CLUSTER_PROCESSES:-2}
    volumes:
      - media:/app/public/uploads
      - app-data:/app/data
      - app-secrets:/secrets:ro
    networks:
      - db
      - edge
    mem_limit: ${ASSURER_APP_MEMORY:-2g}

  # Writes a self-signed certificate valid for 30 days if there is none yet,
  # so nginx can start before certbot has issued the real one.
  cert-bootstrap:
    image: *mongo-image
    entrypoint: ["bash", "-c"]
    command:
      - >-
        if [ ! -s /certs/current/fullchain.pem ]; then
        mkdir -p /certs/current &&
        (umask 077; openssl req -x509 -newkey rsa:2048 -nodes -days 30
        -subj "/CN=$$ASSURER_DOMAIN" -addext "subjectAltName=DNS:$$ASSURER_DOMAIN"
        -keyout /certs/current/privkey.pem -out /certs/current/fullchain.pem 2> /dev/null) &&
        chmod 644 /certs/current/fullchain.pem &&
        echo "[cert-bootstrap] Self-signed certificate written for $$ASSURER_DOMAIN";
        fi
    environment:
      ASSURER_DOMAIN: ${ASSURER_DOMAIN:?set the site's host name}
    volumes:
      - certs:/certs
    network_mode: none

  nginx:
    image: ${ASSURER_REGISTRY:-ghcr.io/mimnets}/assurer-nginx:${ASSURER_IMAGE_TAG:?set the release}
    restart: unless-stopped
    init: true
    depends_on:
      cert-bootstrap:
        condition: service_completed_successfully
    ports:
      - "${ASSURER_HTTP_BIND:-80}:80"
      - "${ASSURER_HTTPS_BIND:-443}:443"
    environment:
      ASSURER_DOMAIN: ${ASSURER_DOMAIN:?set the site's host name}
      APOS_BASE_URL: ${APOS_BASE_URL:?set the public https origin}
      ASSURER_MAX_BODY: ${ASSURER_MAX_BODY:-32m}
      ASSURER_RATE_LIMIT: ${ASSURER_RATE_LIMIT:-30r/s}
      ASSURER_RATE_BURST: ${ASSURER_RATE_BURST:-60}
    volumes:
      - certs:/etc/nginx/certs:ro
      - acme-webroot:/var/www/acme:ro
    networks:
      edge:
        ipv4_address: ${ASSURER_NGINX_IP:-172.30.57.10}
    mem_limit: ${ASSURER_NGINX_MEMORY:-256m}

  # Renews the certificate twice a day when it is due. The first certificate is
  # requested by hand (docs/runbooks/staging-container.md).
  certbot:
    image: ${ASSURER_REGISTRY:-ghcr.io/mimnets}/assurer-certbot:${ASSURER_IMAGE_TAG:?set the release}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        trap exit TERM;
        while :; do
        certbot renew --webroot -w /var/www/acme --quiet;
        sleep 12h & wait $$!;
        done
    volumes:
      - certs:/etc/letsencrypt
      - acme-webroot:/var/www/acme
    mem_limit: ${ASSURER_CERTBOT_MEMORY:-256m}

  # Restore drill (docs/runbooks/pbm-backup-and-restore.md §3), profile
  # "restore". Copies what a rebuild would get back from elsewhere: the
  # secrets, the media and the backups. The restore services get their own
  # copies, never write access to the site's volumes, and their own network,
  # on which restore-mongo is called mongo, so the same addresses and
  # certificate work.
  restore-copy:
    image: *mongo-image
    profiles: [restore]
    entrypoint: ["bash", "-c"]
    command:
      - >-
        cp -a /from/mongo-secrets/. /to/mongo-secrets/ &&
        cp -a /from/app-secrets/. /to/app-secrets/ &&
        cp -a /from/pbm-secrets/. /to/pbm-secrets/ &&
        cp -a /from/media/. /to/media/ &&
        cp -a /from/backups/. /to/backups/
    volumes:
      - mongo-secrets:/from/mongo-secrets:ro
      - app-secrets:/from/app-secrets:ro
      - pbm-secrets:/from/pbm-secrets:ro
      - media:/from/media:ro
      - pbm-backups:/from/backups:ro
      - restore-mongo-secrets:/to/mongo-secrets
      - restore-app-secrets:/to/app-secrets
      - restore-pbm-secrets:/to/pbm-secrets
      - restore-media:/to/media
      - restore-backups:/to/backups
    network_mode: none

  # Starts empty, without the app user, which the restore brings back.
  restore-mongo:
    image: *mongo-image
    profiles: [restore]
    stop_grace_period: 60s
    environment:
      ASSURER_RESTORE: "1"
      ASSURER_MONGO_CACHE_GB: "1"
    volumes:
      - restore-mongo-db:/data/db
      - restore-mongo-secrets:/secrets:ro
    networks:
      restore-db:
        aliases: [mongo]
    healthcheck:
      test: ["CMD", "assurer-mongo-health"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 6

  restore-pbm:
    image: *mongo-image
    profiles: [restore]
    user: pbm
    entrypoint: ["assurer-pbm-agent"]
    depends_on:
      restore-mongo:
        condition: service_healthy
    volumes:
      - restore-backups:/backups
      - restore-pbm-secrets:/secrets:ro
    networks:
      - restore-db

  # Applies the PBM configuration with PITR off, then exits.
  restore-pbm-config:
    image: *mongo-image
    profiles: [restore]
    user: pbm
    entrypoint: ["assurer-backup-schedule"]
    depends_on:
      restore-pbm:
        condition: service_started
    environment:
      ASSURER_BACKUP_INTERVAL_HOURS: "0"
    volumes:
      - restore-pbm-secrets:/secrets:ro
    networks:
      - restore-db

  # Profile "restore-site": started by hand after `pbmc restore`. Plain HTTP
  # on this host's loopback only.
  restore-app:
    image: *app-image
    profiles: [restore-site]
    init: true
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:${ASSURER_RESTORE_PORT:-3044}:3000"
    environment:
      APOS_BASE_URL: http://localhost:${ASSURER_RESTORE_PORT:-3044}
      APOS_CLUSTER_PROCESSES: "1"
      ASSURER_CREATE_ADMIN: "0"
    volumes:
      - restore-media:/app/public/uploads
      - restore-app-data:/app/data
      - restore-app-secrets:/secrets:ro
    networks:
      - restore-db
      - restore-edge

networks:
  edge:
    ipam:
      config:
        - subnet: ${ASSURER_EDGE_SUBNET:-172.30.57.0/24}
  # No route out: only the app, MongoDB and PBM are on it.
  db:
    internal: true
  restore-db:
    internal: true
  # For restore-app's loopback port, which an internal network cannot publish.
  restore-edge:

volumes:
  mongo-db:
  mongo-secrets:
  app-secrets:
  pbm-secrets:
  pbm-backups:
  media:
  app-data:
  certs:
  acme-webroot:
  restore-mongo-db:
  restore-mongo-secrets:
  restore-app-secrets:
  restore-pbm-secrets:
  restore-media:
  restore-app-data:
  restore-backups:
